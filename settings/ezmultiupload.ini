<?php /*

[MultiUploadSettings]
AvailableClasses[]
AvailableClasses[]=folder
AvailableClasses[]=gallery

AvailableSubtreeNode[]

MultiuploadHandlers[]

# enabled: every container the user may create content in takes uploads (the classes of AvailableClasses[] and the
# nodes of AvailableSubtreeNode[] as well); the page offers Upload on every node of the tree, also on sites whose
# containers are not folders (media site: ng_frontpage, ng_category, ng_landing_page ...). disabled: only the
# classes and nodes listed above, as before 6.1.
AnyContainer=enabled

# The largest file the upload page takes, such as 64M, 512k or 1G. The page refuses a larger file before it is
# sent, and the server refuses it again. PHP's upload_max_filesize and post_max_size apply as well: the smallest
# of the three is the limit. 0 or empty: only the PHP limits.
MaxFileSize=64M

# The quick location buttons beside "Change location..." on the upload page of the administration designs (6.1.8):
# one click makes a well-known place the target. They are found from the content tree and content.ini, never from
# fixed node ids (the kernel's expNodeQuickPick, Exponential 6.0.15; without it there are none), and only places the
# user can upload files of the uploaded classes (upload.ini MimeClassMap[], DefaultClass) to are offered.
[QuickLocationSettings]
# disabled: no quick location buttons
QuickLocations=enabled
# The first row. A key is content (Websites: content.ini RootNode), media (MediaRootNode), users, setup, design, a
# node id, remote:<node remote id> or a URL alias path (media/images).
PresetList[]
PresetList[]=content
PresetList[]=media
# Each of these places gets a row with the locations right below it, in the tree's order (the sites under
# Websites; Images, Files, Multimedia ... under Media).
ChildRowList[]
ChildRowList[]=content
ChildRowList[]=media
# At most this many buttons in a row (1 to 50); with more, "More..." opens the location picker at that place.
ChildRowLimit=12

[ZipSettings]
# ZIP files on the upload page: their files are uploaded, also those of ZIP files inside them. The archive is
# unpacked on the server in a private directory of the request (var/<site>/ezmultiupload-zip-<user id>/, mode 0700), which
# is removed afterwards. Every file in it passes the same checks as an uploaded file (types, MaxFileSize, an image
# by its content, the create permission). enabled or disabled.
ZipImport=enabled
# How deep ZIP files may be nested: 1 is the uploaded ZIP file only, 3 a ZIP file in a ZIP file in it
MaxDepth=3
# At most this many entries, over all levels; a larger archive is refused
MaxEntries=1000
# At most this many bytes uncompressed, over all levels; a larger archive is refused
MaxTotalSize=500M
# An entry of at least CompressionRatioMinSize compressed more than this many times refuses the archive (a ZIP bomb)
MaxCompressionRatio=100
CompressionRatioMinSize=1M
# At most this many folders deep inside an archive
MaxPathDepth=16
# Left out silently: these names (any case) and, with SkipHidden=enabled, every name that starts with a dot
SkipNames[]
SkipNames[]=__MACOSX
SkipNames[]=.DS_Store
SkipNames[]=Thumbs.db
SkipNames[]=desktop.ini
SkipHidden=enabled
# The class of the folder items "Keep the folder structure" makes for the archive's folders
FolderClass=folder
# The import backend (expMultiuploadZipImporter: inspect, extract, cleanup) reads the settings above (ZipImport,
# MaxDepth, MaxEntries, MaxTotalSize, MaxCompressionRatio, CompressionRatioMinSize, MaxPathDepth, SkipNames[],
# SkipHidden) and these. MaxTotalSize is capped by PHP's upload_max_filesize and post_max_size when they are lower.
# The largest file in an archive; empty: [MultiUploadSettings] MaxFileSize. PHP's upload limits apply as well.
MaxFileSize=
# The types (by content, never by the name) an archive's files may have, besides the image types of image.ini
# [ImageUploadSettings] AllowedMIMETypes[] (SVG included; the kernel sanitizes it when it is stored). "group/*" takes
# a whole group. Empty: the built-in list (PDF, text, CSV, RTF, Office and OpenDocument files, common audio and video).
AllowedMIMETypes[]
# File extensions that are never taken, whatever the content is; added to the built-in list (php, phtml, phar, exe,
# sh, js, html ...)
DeniedExtensions[]

[FileTypeSettings_folder]
FileType[]
FileType[]=*.*

[FileTypeSettings_gallery]
FileType[]
FileType[]=*.jpg
FileType[]=*.png
FileType[]=*.gif
FileType[]=*.flv
FileType[]=*.mp4
FileType[]=*.mov
FileType[]=*.JPG
FileType[]=*.svg
FileType[]=*.svgz

*/ ?>
